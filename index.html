<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portafolio profesional de Josefa Roca Liberón, estudiante de Ingeniería Informática. Proyectos, educación, certificaciones y contacto."
    />
    <meta name="author" content="Josefa Roca Liberón" />
    <meta name="theme-color" content="#0f172a" />
    <title>Josefa Roca | Portafolio</title>
    <script>
      let redirect = null;
      try {
        redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
        }
      } catch {
        redirect = null;
      }
      if (redirect) {
        window.history.replaceState(null, '', redirect);
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
